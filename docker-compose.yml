name: ${COMPOSE_PROJECT_NAME:-amyb}
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amyb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta npm run configure antes de iniciar}
      POSTGRES_DB: ${POSTGRES_DB:-amyb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    env_file: ${AMYB_ENV_FILE:-.env}
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-amyb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-amyb}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 12

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-amyb_pgdata}
