server {
    listen 80;
    listen [::]:80;
    server_name amyb-stg.hackteck.cl;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name amyb-stg.hackteck.cl;

    ssl_certificate /etc/ssl/certs/staging-wildcard.origin.crt;
    ssl_certificate_key /etc/ssl/private/staging-wildcard.origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:staging_SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    root /var/www/staging/amyb/current/frontend/dist;
    index index.html;
    access_log /var/www/staging/amyb/shared/logs/nginx-access.log;
    error_log /var/www/staging/amyb/shared/logs/nginx-error.log warn;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    auth_basic "Hackteck Staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;
    client_max_body_size 2m;

    location /api/ {
        # Sin barra final: conserva el prefijo /api de Express.
        proxy_pass http://127.0.0.1:4202;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
